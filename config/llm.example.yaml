# LLM provider configuration.
# Copy to llm.yaml and edit as needed. When llm.yaml is absent the router
# loads THIS file, so these are the production defaults.
#
# API keys are loaded from environment variables (see .env.example).
# This file controls model selection, routing, and rate limits — not credentials.
#
# Cost policy (docs/compute_cost_evaluation.md): every purpose routes to
# `anthropic`, a metered API that costs cents per VOD and nothing when idle.
# The `openllm` / `openllm_vision` entries stay defined for an operator who
# runs a GPU box with Ollama (docs/pc_worker_runbook.md) — point the purposes
# back at them and set CHALYBCLIP_OPENLLM_BASE_URL. Nothing routes there by
# default because an unreachable localhost fails every call.

providers:
  # Self-hosted open models (optional). Default base_url is a local Ollama;
  # the CHALYBCLIP_OPENLLM_BASE_URL env var overrides it (a tunneled GPU box,
  # or a hosted OpenAI-compatible gateway such as Groq / OpenRouter — then
  # set OPENLLM_API_KEY too). Not in any routing chain by default.
  openllm:
    kind: openai_compatible
    api_key_env: OPENLLM_API_KEY
    api_key_required: false
    base_url: http://localhost:11434/v1
    base_url_env: CHALYBCLIP_OPENLLM_BASE_URL
    models:
      standard: qwen2.5:7b-instruct-q4_K_M      # already pulled on the Quantor PC
      premium: qwen2.5:7b-instruct-q4_K_M       # bump when the box has VRAM for a 14B
    timeout_s: 120                              # local inference is slower than an API

  # Vision-capable open model for the multimodal purposes (clip scoring,
  # visual variant generation). Same runtime, different model tag.
  openllm_vision:
    kind: openai_compatible
    api_key_env: OPENLLM_API_KEY
    api_key_required: false
    base_url: http://localhost:11434/v1
    base_url_env: CHALYBCLIP_OPENLLM_BASE_URL
    models:
      standard: qwen2.5vl:7b
      premium: qwen2.5vl:7b
    timeout_s: 180

  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    models:
      standard: claude-haiku-4-5                # fast + cheap, vision-capable; ~$0.03/VOD for text
      premium: claude-opus-5                    # the two `premium` purposes only (logo, agent decisions)
    rate_limits:
      requests_per_minute: 1000
      input_tokens_per_minute: 400000
      output_tokens_per_minute: 80000
    timeout_s: 30

# Routing rules per "purpose" (the use case of the call).
# The router resolves: purpose -> quality -> provider -> model.
routing:
  vision_rescore:                               # frame-based rescore of detect candidates
    default_quality: standard
    primary: anthropic
    fallbacks: []

  variant_generation_visual:                    # Phase 2+, multimodal
    default_quality: standard
    primary: anthropic
    fallbacks: []

  clip_scoring:                                 # Phase 2+, multimodal scoring
    default_quality: standard
    primary: anthropic
    fallbacks: []

  agent_decision:                               # alter-ego auto-approval reasoning
    default_quality: premium
    primary: anthropic
    fallbacks: []

  viral_detection:                              # LLM scan of transcript for viral moments
    default_quality: standard
    primary: anthropic
    fallbacks: []

  logo_generation:                              # AI-generated SVG brand mark (voice-markers §3.3.a)
    default_quality: premium
    primary: anthropic
    fallbacks: []

  hook_generation:                              # Viral-hook title variants (slice F.7-B)
    default_quality: standard
    primary: anthropic
    fallbacks: []

# Reliability
retry:
  max_attempts: 3
  initial_backoff_s: 1.0
  backoff_multiplier: 4.0
  retryable_status_codes: [429, 500, 502, 503, 504]

circuit_breaker:
  error_rate_threshold: 0.20                    # >20% errors over window -> trip
  window_s: 300
  recovery_s: 300

# Cost tracking — used to compute cost_usd_micros per call.
# Open models have no pricing entry: unlisted (provider, model) pairs cost 0.
pricing:
  anthropic:
    claude-haiku-4-5:
      input_per_mtok_usd: 1.00
      output_per_mtok_usd: 5.00
    claude-opus-5:
      input_per_mtok_usd: 5.00
      output_per_mtok_usd: 25.00
